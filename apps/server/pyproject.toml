[project]
name = "openwebrx-plus-server"
version = "0.1.0"
description = "Backend orchestration for OpenWebRX+ modernization. Preserves upstream OpenWebRX+ source backends, pycsdr DSP chain, WebSocket protocol, and plugin ecosystem."
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "OpenWebRX+ Modernization" }]

# --- Runtime dependencies ---
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    # Outbound HTTP for the remote-receiver directories (ADR-006):
    # rx.kiwisdr.com + receiverbook.de fetches, TTL-cached.
    "httpx>=0.27.2",
    # Config
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    # TOML writer for the user-settings persistence (slice-5.1).
    # tomllib (stdlib) reads; tomli_w writes. We need both for round-trip.
    "tomli_w>=1.0.0",
    # Numerics / DSP glue
    "numpy>=2.1.3",
    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.1",
    # Primary DSP library — pycsdr (Python bindings for libcsdr, the same
    # library that powers upstream OpenWebRX). NOT on PyPI; installed as a
    # PEP 508 direct reference to the upstream git repo (develop branch is
    # the default upstream branch). libcsdr must be installed first — see
    # scripts/README-dsp-bootstrap.md in the repo root for the one-time
    # build steps (cmake + libfftw3-dev + libsamplerate). The
    # [[tool.mypy.overrides]] block below tolerates its absence during
    # type check. See ADR-004 for rationale.
    "pycsdr @ git+https://github.com/jketterl/pycsdr.git@develop",
]

[project.scripts]
openwebrx-plus = "openwebrx_plus.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# pycsdr is a PEP 508 direct git reference (not on PyPI) — hatchling
# refuses to build the project metadata without this flag. Installers
# that can't reach github (or shouldn't evict the restored pycsdr) can
# install with `--no-deps` and follow scripts/README-dsp-bootstrap.md.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["openwebrx_plus"]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "httpx>=0.27.2",  # for FastAPI TestClient
    "anyio>=4.6.2",
    # OFFLINE ONLY — see ADR-004. scipy is for filter design, recorded-IQ
    # analysis, unit-test fixtures, and statistical work. NEVER imported by
    # the live DSP chain (apps/server/openwebrx_plus/dsp/) — CI lint rule
    # (slice-3) will reject scipy imports outside tests/scripts/offline/.
    "scipy>=1.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "TID", "ASYNC"]
# E501: let formatter handle line length
# TID252: prefer relative imports — the existing codebase uses relative imports
#         throughout (from .base, from ..sources); forcing absolute imports
#         would be a no-op churn. Disable the rule rather than churn the code.
ignore = ["E501", "TID252"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = false  # tolerate the pycsdr/pyrtlsdr override block when those packages aren't installed
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # FastAPI decorators don't have great stubs

[[tool.mypy.overrides]]
module = ["pycsdr.*", "pyrtlsdr.*", "soapysdr.*", "pyairspy.*", "sdrplay.*", "cffi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers --cov=openwebrx_plus --cov-report=term-missing"
